name: PR Quality Gate

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint, Format, Tests y Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (TypeScript)
        run: npm run typecheck

      # TODO: habilitar reporte de cobertura cuando haya componentes con tests.
      - name: Ejecutar tests
        run: npm run test

      - name: Build de librería
        run: npm run build

      - name: Build de Storybook
        run: npm run build-storybook
